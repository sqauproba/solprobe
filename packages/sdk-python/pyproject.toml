[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solprobe-sdk"
version = "0.1.0"
description = "Python SDK for the SolProbe API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["sdk_python"]
