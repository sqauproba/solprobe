global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "solprobe-api"
    static_configs:
      - targets: ["api:8080"]

  - job_name: "solprobe-collector"
    static_configs:
      - targets: ["collector:50051"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
