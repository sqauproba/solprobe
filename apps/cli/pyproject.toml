[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solprobe"
version = "0.1.0"
description = "Production-grade Solana observability, diagnostics, and developer tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.60",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4",
]

[project.scripts]
solprobe = "solprobe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["solprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
