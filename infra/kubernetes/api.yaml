apiVersion: apps/v1
kind: Deployment
metadata:
  name: solprobe-api
  labels:
    app: solprobe-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solprobe-api
  template:
    metadata:
      labels:
        app: solprobe-api
    spec:
      containers:
        - name: api
          image: solprobe/api:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: API_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: solprobe-api
spec:
  selector:
    app: solprobe-api
  ports:
    - port: 8080
      targetPort: 8080
