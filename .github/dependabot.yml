version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/services/analyzer"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/services/collector"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/dashboard"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/services/alerts"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
