syntax = "proto3";

package solprobe.events;

// Normalized events produced by the collector and consumed by the API,
// analyzer, and alerts services.

message SlotEvent {
  uint64 slot = 1;
  optional uint64 parent = 2;
  optional uint64 root = 3;
}

message AccountEvent {
  string address = 1;
  string owner = 2;
  optional uint64 lamports = 3;
  bytes data = 4;
}

message LogEvent {
  string signature = 1;
  repeated string logs = 2;
  optional string err = 3;
}

message Envelope {
  oneof event {
    SlotEvent slot = 1;
    AccountEvent account = 2;
    LogEvent log = 3;
  }
  uint64 received_unix_ms = 10;
}
