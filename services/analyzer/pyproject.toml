[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solprobe-analyzer"
version = "0.1.0"
description = "Historical analysis and anomaly detection for SolProbe."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "celery>=5.3",
    "redis>=5.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["solprobe_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
